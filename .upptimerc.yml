secrets:
  - VAULTWARDEN
  - EMAIL1
  - EMAIL2
  - PROXY1
  - PROXY2
  - NAS1

# Change these first
owner: vitalangfoundation # Your GitHub organization or username, where this repository lives
repo: upptime # The name of this repository

sites:
  - name: VitaLang Website
    url: https://www.vitalang.net
  - name: Matrix Server
    url: https://sweetmessaging.vitalang.net
  - name: Vaultwarden
    url: $VAULTWARDEN
  - name: Office Sweet
    url: https://officesweet.vitalang.net/ajax/login
  - name: Euler Club Site
    url: https://euler.vitalang.net
  - name: Email Service Part 1
    url: $EMAIL1
  - name: Email Service Part 2
    url: $EMAIL2
    method: POST
    expectedStatusCodes:
      - 415
  - name: Main Proxy
    url: $PROXY1
  - name: Private Proxy
    url: $PROXY2
  - name: NAS 1
    url: $NAS1


status-website:
  cname: status.vitalang.net
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: VitaLang Status
  introTitle:
  introMessage:
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
